robot:
  robot_specifications:
    - initial_pose:
        x: 0
        y: 0
        theta: 0
    - center_of_rotation:
        x: 0.1
        y: 0.0
    - footprint:
        footprint_specifications:
          points:
            - point:
                x: 0.1
                y: 0.1
            - point:
                x: -0.1
                y: 0.1
            - point:
                x: -0.1
                y: -0.1
            - point:
                x: 0.1
                y: -0.1
